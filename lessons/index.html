<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Урок · Design Engineering</title>
<style>
:root{--bg:#faf9f7;--surface:#fff;--border:#e4e0da;--text:#201e1a;--muted:#6b6459;--accent:#b5502f;--accent-soft:#f4e6df}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5}.layout{display:flex;min-height:100vh}.sidebar{width:280px;position:sticky;top:0;height:100vh;overflow:auto;padding:32px 20px;background:var(--surface);border-right:1px solid var(--border)}.title{font-weight:800;margin:0 0 4px}.progress{font-size:12px;color:var(--muted);margin:0 0 22px}.lessons{display:grid;gap:3px}.lessons a{display:grid;grid-template-columns:28px 1fr;gap:8px;min-height:44px;padding:8px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-size:13px}.lessons a:hover{background:var(--bg);color:var(--text)}.lessons a[aria-current=page]{background:var(--accent-soft);color:var(--text);font-weight:700}.num{color:var(--accent);font-variant-numeric:tabular-nums}.state{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-top:2px}main{flex:1;display:grid;place-items:center;padding:48px}.empty{width:min(100%,680px);border-top:2px solid var(--text);padding-top:24px}.lesson-number{color:var(--accent);font-size:13px;font-weight:800}.empty h1{font-size:clamp(32px,5vw,58px);line-height:1.05;letter-spacing:-.025em;margin:12px 0 18px}.empty p{color:var(--muted);max-width:58ch}.back{display:inline-flex;min-height:44px;align-items:center;margin-top:18px;color:var(--text);font-weight:700;text-underline-offset:4px}.mobile{display:none}.skip{position:fixed;left:12px;top:12px;transform:translateY(-150%);padding:10px;background:var(--text);color:#fff;z-index:2}.skip:focus{transform:none}a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}@media(max-width:800px){.sidebar{display:none}.mobile{display:block;margin-bottom:28px}.mobile summary{min-height:48px;padding:13px 16px;background:var(--surface);border:1px solid var(--border);border-radius:10px;font-weight:700;cursor:pointer}.mobile nav{display:grid;background:var(--surface);border:1px solid var(--border);border-top:0;padding:8px}.mobile a{padding:10px;color:var(--muted)}main{display:block;padding:24px 20px}.empty{margin-top:72px}}
</style>
</head>
<body><a class="skip" href="#content">Перейти до матеріалу</a><div class="layout"><aside class="sidebar"><p class="title">Design Engineering</p><p class="progress" id="progress">Урок</p><nav class="lessons" id="desktop-nav" aria-label="Уроки курсу"></nav></aside><main id="content"><details class="mobile"><summary id="mobile-summary">Уроки курсу</summary><nav id="mobile-nav" aria-label="Уроки курсу"></nav></details><article class="empty"><div class="lesson-number" id="lesson-number"></div><h1 id="lesson-title"></h1><p>Матеріал цього уроку ще не додано. Сторінка вже створена, щоб структура курсу залишалася сталою в міру проходження.</p><a class="back" href="../research/research.html">← Повернутися до уроку 1</a></article></main></div>
<script>
const lessons=['Ресерч і бенчмарк','Персони і JTBD','Інформаційна архітектура','Прототипування і вайрфреймінг','Тон оф войс і мікрокопі','Концепт','Збірка UI','Design Tokens','Дизайн-система','Responsive','Анімація і мікроінтеракції','Хендофф і документація'];
const requested=Number(new URLSearchParams(location.search).get('lesson'));const current=requested>=2&&requested<=12?requested:2;
document.title=`Урок ${current} — ${lessons[current-1]} · Design Engineering`;document.querySelector('#progress').textContent=`Урок ${current} із 12`;document.querySelector('#mobile-summary').textContent=`Урок ${String(current).padStart(2,'0')} із 12 · ${lessons[current-1]}`;document.querySelector('#lesson-number').textContent=`УРОК ${String(current).padStart(2,'0')} · НЕЗАБАРОМ`;document.querySelector('#lesson-title').textContent=lessons[current-1];
const link=(title,index)=>{const n=index+1,a=document.createElement('a');a.href=n===1?'../research/research.html':`?lesson=${n}`;a.innerHTML=`<span class="num">${String(n).padStart(2,'0')}</span><span>${title}<span class="state">${n===current?'Поточна сторінка':n===1?'Готово':'Незабаром'}</span></span>`;if(n===current)a.setAttribute('aria-current','page');return a};lessons.forEach((title,index)=>{document.querySelector('#desktop-nav').append(link(title,index));const a=link(title,index);a.textContent=`${String(index+1).padStart(2,'0')} · ${title}`;document.querySelector('#mobile-nav').append(a)});
</script></body></html>
