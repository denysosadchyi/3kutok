<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Оболонка — Куток</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components/index.css">
<script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
<script>
/* Темна тема (tokens.css, [data-theme="dark"]) — частина продукту з 2026-10-23 */
(function () {
  var KEY = "kutok-theme", root = document.documentElement;
  function saved() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function apply(dark) {
    if (dark) root.setAttribute("data-theme", "dark"); else root.removeAttribute("data-theme");
    document.querySelectorAll(".theme-toggle").forEach(function (b) {
      b.setAttribute("aria-pressed", dark ? "true" : "false");
      var i = b.querySelector("iconify-icon");
      if (i) i.setAttribute("icon", dark ? "solar:sun-2-linear" : "solar:moon-linear");
    });
  }
  apply(saved() === "dark");
  document.addEventListener("DOMContentLoaded", function () { apply(saved() === "dark"); });
  document.addEventListener("click", function (e) {
    var b = e.target.closest(".theme-toggle");
    if (!b) return;
    var dark = root.getAttribute("data-theme") !== "dark";
    apply(dark);
    try { localStorage.setItem(KEY, dark ? "dark" : "light"); } catch (err) {}
  });
  window.addEventListener("storage", function (e) { if (e.key === KEY) apply(e.newValue === "dark"); });
})();
</script>
<style>
/* Перемикач темної теми — частина оболонки (з 2026-10-23), новий екран його
   має. Те саме розміщення, що в wireframes/screens.css. */
.header__top:has(> .theme-toggle) { position: relative; }
.header__top > .theme-toggle { position: absolute; top: var(--space-2); right: var(--space-2); }
</style>
</head>
<!--
  Оболонка «Кутка» як розмітка. Новий екран копіює цей файл і заповнює
  .shell__main. Верхній шар і нижній пояс міняються разом із модифікаторами
  на <body>:

  верх          | нижній пояс | клас body
  --------------+-------------+--------------------------------------------
  двошарова     | меню        | shell shell--header shell--tabbar   (цей файл)
  компактний    | панель дії  | shell shell--actionbar              (#topbar-title + #actionbar)
  поверх фото   | панель дії  | shell shell--photo-top shell--actionbar (#topbar-photo + #actionbar)
  з людиною     | поле чату   | shell shell--composer               (#topbar-person + #composer)

  Варіанти лежать у <template> внизу файла — розмітку беремо звідти.
-->
<body class="shell shell--header shell--tabbar">

<header class="header">
  <div class="header__top">
    <button class="topbar__action theme-toggle" type="button" aria-pressed="false" aria-label="Темна тема"><iconify-icon icon="solar:moon-linear" aria-hidden="true"></iconify-icon></button>
    <h1 class="header__title">Результати пошуку</h1>
    <p class="header__subtitle">Київ · кімнати та співмешканці</p>
  </div>
  <div class="header__bar">
    <div class="chip-row"><div class="chip-row__track">
      <details class="sheet">
        <summary class="chip chip--selected"><iconify-icon icon="solar:tuning-2-linear" aria-hidden="true"></iconify-icon>Фільтри · 3</summary>
        <section class="sheet__panel" aria-labelledby="filters-title">
          <div class="sheet__grabber" aria-hidden="true"></div>
          <div class="sheet__head"><h2 class="sheet__title" id="filters-title">Фільтри</h2><a class="button button--text" href="#">Скасувати</a></div>
          <form class="sheet__body" action="#" method="get">
            <fieldset>
              <legend class="sr-only">Базові умови кімнати</legend>
              <div class="field"><label class="field__label" for="district">Район Києва</label><select class="input" id="district" name="district"><option>Усі райони</option><option selected>Шевченківський</option><option>Подільський</option><option>Голосіївський</option><option>Дніпровський</option></select></div>
              <div class="field"><label class="field__label" for="budget">Бюджет до, грн/місяць</label><input class="input" id="budget" name="budget" type="number" inputmode="numeric" min="1000" step="500" value="12000"></div>
              <div class="field"><label class="field__label" for="move-in">Дата заїзду</label><input class="input" id="move-in" name="move-in" type="text" inputmode="none" readonly value="з 1 жовтня 2026"></div>
            </fieldset>
          </form>
          <div class="sheet__foot"><a class="button button--primary button--block" href="#">Застосувати фільтри</a></div>
        </section>
      </details>
      <span class="chip">Шевченківський</span>
      <span class="chip">до 12 000 грн</span>
      <span class="chip">з 1 жовтня</span>
    </div></div>
  </div>
</header>

<main class="shell__main" id="content">
  <!-- Контент екрана -->
</main>

<nav class="tabbar" aria-label="Головна навігація">
  <ul class="tabbar__list">
    <li><a class="tabbar__item" href="#" aria-current="page"><iconify-icon icon="streamline-freehand:search-magnifier" aria-hidden="true"></iconify-icon><span>Пошук</span></a></li>
    <li><a class="tabbar__item" href="#"><iconify-icon icon="streamline-freehand:messages-bubble-smile" aria-hidden="true"></iconify-icon><span>Чати</span></a></li>
    <li><a class="tabbar__item" href="#"><iconify-icon icon="streamline-freehand:smiley-happy" aria-hidden="true"></iconify-icon><span>Профіль</span></a></li>
  </ul>
</nav>

<!-- ═══ Варіанти верхнього шару ═══ -->

<!-- Назва в шапці — <h1>, якщо нижче на екрані немає власного h1.
     У профілі h1 — ім'я людини, тож тут <p>. ⋯ — «Заблокувати чи поскаржитися». -->
<template id="topbar-title">
  <header class="topbar">
    <a class="topbar__back" href="#" aria-label="Назад до оголошення"><iconify-icon icon="solar:alt-arrow-left-linear" aria-hidden="true"></iconify-icon></a>
    <p class="topbar__title">Профіль Ірини</p>
    <button class="topbar__action" type="button" aria-label="Заблокувати чи поскаржитися"><iconify-icon icon="solar:menu-dots-linear" aria-hidden="true"></iconify-icon></button>
  </header>
</template>

<template id="topbar-photo">
  <header class="topbar topbar--over-photo">
    <a class="topbar__back" href="#" aria-label="Назад до результатів"><iconify-icon icon="solar:alt-arrow-left-linear" aria-hidden="true"></iconify-icon></a>
    <span></span><button class="topbar__action" type="button" aria-label="Заблокувати чи поскаржитися"><iconify-icon icon="solar:menu-dots-linear" aria-hidden="true"></iconify-icon></button>
  </header>
</template>

<template id="topbar-person">
  <header class="topbar topbar--person">
    <a class="topbar__back" href="#" aria-label="Назад до оголошення"><iconify-icon icon="solar:alt-arrow-left-linear" aria-hidden="true"></iconify-icon></a>
    <a class="topbar__person" href="#"><span class="avatar"><img src="../visuals/person-iryna.jpg" alt="Фото профілю Ірини"></span><strong class="topbar__name">Ірина</strong><span class="topbar__verified" title="Номер підтверджено 12 вересня"><iconify-icon icon="solar:shield-check-linear" aria-hidden="true"></iconify-icon><span class="sr-only">Номер підтверджено 12 вересня</span></span></a>
    <button class="topbar__action" type="button" aria-label="Заблокувати чи поскаржитися"><iconify-icon icon="solar:menu-dots-linear" aria-hidden="true"></iconify-icon></button>
  </header>
</template>

<!-- ═══ Варіанти нижнього поясу ═══ -->

<template id="actionbar">
  <div class="actionbar"><a class="button button--primary" href="#">Написати Ірині</a></div>
</template>

<template id="composer">
  <form class="composer"><label class="sr-only" for="message">Повідомлення Ірині</label><textarea class="composer__input" id="message" name="message" rows="1" placeholder="Повідомлення"></textarea><button class="composer__send" type="button" aria-disabled="true" aria-label="Надіслати"><iconify-icon icon="solar:plain-2-linear" aria-hidden="true"></iconify-icon></button></form>
</template>

<script>
/* Шторка: закрити тапом поза панеллю або Esc */
document.addEventListener("click", function (e) {
  var dismiss = e.target.closest('.sheet__panel a[href="#"]');
  if (dismiss) { e.preventDefault(); dismiss.closest("details.sheet").open = false; return; }
  var sheet = e.target.closest("details.sheet[open]");
  if (sheet && !e.target.closest(".sheet__panel, summary")) sheet.open = false;
});
document.addEventListener("keydown", function (e) {
  if (e.key !== "Escape") return;
  document.querySelectorAll("details.sheet[open]").forEach(function (d) { d.open = false; });
});
</script>
</body>
</html>
