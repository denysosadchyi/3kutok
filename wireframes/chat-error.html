<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="wireframe-job" content="Related 4 — перевести придатний варіант у взаємну домовленість">
<title>Чат з Іриною — помилка</title>
<link rel="stylesheet" href="listings-states.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="concept-skin.css">
<script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
</head>
<body class="has-composer skin">
<header class="appbar"><a class="appbar-back" href="listing.html" aria-label="Назад до оголошення"><svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M12.5 4.5 7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a><a class="appbar-person" href="profile.html"><span class="avatar"><img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=96&q=70&auto=format&fit=crop&crop=faces" alt="Фото профілю Ірини"></span><strong>Ірина</strong><span class="verified-mark" title="Номер підтверджено"><iconify-icon icon="solar:shield-check-linear" aria-hidden="true"></iconify-icon><span class="sr-only">Номер підтверджено</span></span></a><button class="appbar-action" type="button" aria-label="Заблокувати або поскаржитися"><svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><circle cx="4.5" cy="10" r="1.6" fill="currentColor"/><circle cx="10" cy="10" r="1.6" fill="currentColor"/><circle cx="15.5" cy="10" r="1.6" fill="currentColor"/></svg></button></header>
<main id="content">
<a class="chat-context" href="listing.html"><img class="thumb" src="https://images.unsplash.com/photo-1522771739844-6a9f6d5f14af?w=160&q=70&auto=format&fit=crop" alt="Фото кімнати"><span class="grow"><strong>Кімната біля Лук’янівської</strong><span>10 500 грн/міс · з 1 жовтня</span></span><svg class="chevron" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="m6 3.5 4.5 4.5L6 12.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
<section class="state state-error" role="alert">
  <div class="state-icon"><iconify-icon icon="streamline-freehand:alerts-warning-triangle" aria-hidden="true"></iconify-icon></div>
  <h2>Не вдалося завантажити повідомлення</h2>
  <p>Перевір з’єднання й спробуй ще. Чернетку збережено — її не надіслано.</p>
  <div class="actions"><a class="btn btn-primary" href="chat.html">Спробувати ще</a></div>
</section>
</main>
<form class="composer"><label class="sr-only" for="message">Повідомлення Ірині</label><textarea id="message" name="message" rows="1" placeholder="Повідомлення">Чи можна подивитися кімнату в суботу?</textarea><a class="send" href="chat.html" aria-label="Надіслати"><iconify-icon icon="solar:plain-2-linear" aria-hidden="true"></iconify-icon></a></form>
<script>
document.addEventListener("click", function (e) {
  var sheet = e.target.closest("details.sheet[open]");
  if (sheet && !e.target.closest(".sheet-panel, summary")) sheet.open = false;
});
document.addEventListener("keydown", function (e) {
  if (e.key !== "Escape") return;
  document.querySelectorAll("details.sheet[open]").forEach(function (d) { d.open = false; });
});
</script>
</body>
</html>
