<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="wireframe-job" content="Related 1 — звузити пошук до прийнятних варіантів">
<title>Результати пошуку — завантаження</title>
<link rel="stylesheet" href="listings-states.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="concept-skin.css">
<script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
</head>
<body class="has-tabbar skin">
<header class="appbar-large"><h1>Результати пошуку</h1><p>Київ · кімнати та співмешканці</p></header>
<main id="content" aria-busy="true">

<div class="filters"><div class="filter-row">
  <details class="sheet">
    <summary class="chip chip-strong"><iconify-icon icon="solar:tuning-2-linear" aria-hidden="true"></iconify-icon>Фільтри · 3</summary>
    <section class="sheet-panel" aria-labelledby="filters-title">
      <div class="sheet-grabber" aria-hidden="true"></div>
      <div class="sheet-head"><h2 id="filters-title">Фільтри</h2><a class="btn btn-plain" href="listings.html">Скасувати</a></div>
      <form class="sheet-body" action="listings.html" method="get">
        <fieldset>
          <legend class="sr-only">Базові умови кімнати</legend>
          <div class="field"><label for="district">Район Києва</label><select id="district" name="district"><option>Усі райони</option><option selected>Шевченківський</option><option>Подільський</option><option>Голосіївський</option><option>Дніпровський</option></select></div>
          <div class="field"><label for="budget">Бюджет до, грн/місяць</label><input id="budget" name="budget" type="number" inputmode="numeric" min="1000" step="500" value="12000"></div>
          <div class="field"><label for="move-in">Дата заїзду</label><input id="move-in" name="move-in" type="text" inputmode="none" readonly value="з 1 жовтня 2026"></div>
        </fieldset>
      </form>
      <div class="sheet-foot"><a class="btn btn-primary btn-block" href="listings.html">Застосувати фільтри</a></div>
    </section>
  </details>
  <span class="chip">Шевченківський</span>
  <span class="chip">до 12 000 грн</span>
  <span class="chip">з 1 жовтня</span>
</div></div>
<div class="results-meta"><span role="status">Завантажуємо оголошення</span></div>
<ul class="card-list" aria-hidden="true">
  <li class="card"><div class="skeleton card-photo"></div><div class="card-body stack-8"><div class="skeleton sk-title"></div><div class="skeleton sk-line w-60"></div></div></li>
  <li class="card"><div class="skeleton card-photo"></div><div class="card-body stack-8"><div class="skeleton sk-title"></div><div class="skeleton sk-line w-60"></div></div></li>
  <li class="card"><div class="skeleton card-photo"></div><div class="card-body stack-8"><div class="skeleton sk-title"></div><div class="skeleton sk-line w-60"></div></div></li>
</ul>
</main>
<nav class="tabbar" aria-label="Головна навігація"><ul><li><a href="listings.html" aria-current="page"><iconify-icon icon="streamline-freehand:search-magnifier" aria-hidden="true"></iconify-icon><span>Пошук</span></a></li><li><a href="chat.html"><iconify-icon icon="streamline-freehand:messages-bubble-smile" aria-hidden="true"></iconify-icon><span>Чати</span></a></li><li><span class="tab"><iconify-icon icon="streamline-freehand:smiley-happy" aria-hidden="true"></iconify-icon><span>Профіль</span></span></li></ul></nav>
<script>
document.addEventListener("click", function (e) {
  var sheet = e.target.closest("details.sheet[open]");
  if (sheet && !e.target.closest(".sheet-panel, summary")) sheet.open = false;
});
document.addEventListener("keydown", function (e) {
  if (e.key !== "Escape") return;
  document.querySelectorAll("details.sheet[open]").forEach(function (d) { d.open = false; });
});
</script>
</body>
</html>
